version: 0.0
os: linux
files:
  # 실행 스크립트 복사
  - source: scripts/start_server.sh
    destination: /home/ubuntu/scripts
    overwrite: true

  # 권한 수정 스크립트 복사
  - source: scripts/change_permissions.sh
    destination: /home/ubuntu/scripts
    overwrite: true

  # Docker Compose 파일 복사
  - source: docker-compose.yml
    destination: /home/ubuntu/frontend
    overwrite: true

permissions:
  - object: /home/ubuntu/frontend
    pattern: "**"
    owner: ubuntu
    group: ubuntu
    mode: 755

hooks:
  # 파일 설치 직후(AfterInstall)에 실행
  AfterInstall:
    - location: scripts/change_permissions.sh
      timeout: 60
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: ubuntu
